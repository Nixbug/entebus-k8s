apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: entebus
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - run
            - --credentials-file
            - /etc/cloudflared/credentials.json
            - --no-autoupdate
          volumeMounts:
            - name: cloudflared-creds
              mountPath: /etc/cloudflared
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: cloudflared-creds
          secret:
            secretName: cloudflared-credentials

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: entebus
